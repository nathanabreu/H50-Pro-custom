[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h50console"
version = "0.1.0"
description = "Painel web local para aspiradores Xiaomi da família ov (H50 Pro), sem dependências"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []          # só a biblioteca padrão
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Operating System :: OS Independent",
]

[project.scripts]
h50console = "h50console.__main__:main"

[tool.setuptools]
packages = ["h50console"]

[tool.setuptools.package-data]
h50console = ["static/*", "spec/*.json"]
